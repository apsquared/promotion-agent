name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run review:build
      - run: npm pack --dry-run --json
